[alembic]
script_location = alembic

# Put the project root on sys.path so `alembic/env.py` can `import app`.
#
# Without this, the bare `alembic` console script fails with
# "ModuleNotFoundError: No module named 'app'" — the script does not add the
# working directory to sys.path. It happens to work when invoked as
# `python -m alembic`, because that form does, which is a good way to have a
# broken command that passes every local test.
prepend_sys_path = .

# Overridden at runtime from DATABASE_URL / DATABASE_URL_SYNC in alembic/env.py.
# This value is only a fallback for a bare `alembic` invocation with no env.
sqlalchemy.url = postgresql://tea_user:tea_pass@localhost:5432/tea_packaging

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
