services:
  db:
    image: postgres:16-alpine
    container_name: tea_packaging_db
    # Defaults so the stack starts even with an empty or missing .env. Postgres
    # refuses to initialise without a password and exits(1), which took down the
    # whole `docker compose up` on the first command a new user runs.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tea_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tea_pass}
      POSTGRES_DB: ${POSTGRES_DB:-tea_packaging}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tea_user} -d ${POSTGRES_DB:-tea_packaging}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: tea_packaging_api
    # Optional: without this, a missing .env aborts `docker compose up` before
    # anything starts. Every value the backend needs has a default below, so the
    # stack runs on a bare clone; .env only supplies your own overrides (chiefly
    # OPENAI_API_KEY).
    env_file:
      - path: .env
        required: false
    environment:
      # Derived, NOT taken from .env. Inside this network the database host is
      # `db`; on the host it is `localhost`. One variable cannot be right for
      # both, and the .env value has to serve local uvicorn, so compose builds
      # its own. Deriving it removes a whole class of "connection refused".
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tea_user}:${POSTGRES_PASSWORD:-tea_pass}@db:5432/${POSTGRES_DB:-tea_packaging}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-tea_user}:${POSTGRES_PASSWORD:-tea_pass}@db:5432/${POSTGRES_DB:-tea_packaging}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # Alembic owns the schema here, as it does in production. Leaving this on
      # would let the app create its own tables and quietly paper over a broken
      # migration — which is exactly what happened: `alembic upgrade head` failed
      # while the API served requests happily against create_all's tables.
      AUTO_CREATE_TABLES: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    # Migrate, then serve. `docker compose up` should produce a working app; a
    # README that says "now remember to run migrations" is a step to forget.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      args:
        # Public config only. A secret passed here is baked into the JS bundle
        # and into the image's build history. The OpenAI key belongs to the
        # backend service above.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: tea_packaging_ui
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend

volumes:
  pgdata:
